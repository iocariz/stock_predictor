[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-predictor"
version = "0.1.0"
description = "LightGBM ranker for S&P 500 equities: PIT universe, purged walk-forward, cash-ledger backtest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "lightgbm>=4.6.0",
    "lxml>=6.0.2",
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "optuna>=4.7.0",
    "pandas>=3.0.0",
    "pyarrow>=18.0.0",
    "scikit-learn>=1.8.0",
    "yfinance>=1.2.1",
]

[project.optional-dependencies]
tiingo = [
    "requests>=2.31.0",
    "fredapi>=0.5.0",
    "python-dotenv>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
train-sp500 = "stock_predictor.cli:main"
backtest-sp500 = "stock_predictor.backtest:main"
predict-sp500 = "stock_predictor.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pyflakes + a pragmatic slice of pycodestyle, plus import sorting.
# Deliberately not the full default set: the wider rules flag intentional
# patterns here (broad excepts that keep a download batch from killing a run,
# matplotlib backend selection before import).
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# matplotlib.use("Agg") must run before pyplot is imported.
"src/stock_predictor/backtest_reporting.py" = ["E402"]
"src/stock_predictor/cli.py" = ["E402"]
# Re-exports so `from stock_predictor.backtest import print_report` keeps working.
"src/stock_predictor/backtest.py" = ["E402", "F401"]
"src/stock_predictor/__init__.py" = ["F401"]
