# Prove the API keys actually work, without training anything.
#
# A secret that exists is not a secret that works. TIINGO_API_KEY has been
# configured, correctly named and correctly referenced -- and none of that
# establishes that the value is a working key, because GitHub never exposes a
# secret to anyone. Only a run that calls the vendor can tell you.
#
# The only thing that would have exercised it is the monthly retrain, which
# takes hours and burns real quota, so a wrong value would be discovered by
# losing a scheduled run. That is how the 2026-09-01 cron failed. This is the
# cheap version: one auth call, one small price call, no training, no sync.
#
# Manual only. A cron calling a vendor on a timer is quota nobody asked to
# spend, and this answers a question you ask deliberately.

name: verify-secrets

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

    steps:
      # No checkout, no uv, no dependency sync: this uses the runner's stdlib
      # python. Installing the project would make the check slower than the
      # failure mode it exists to catch early.
      - name: Tiingo — key present
        run: |
          if [ -z "${TIINGO_API_KEY}" ]; then
            echo "::error::TIINGO_API_KEY is not set."
            echo "Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "Scheduled retrains train on the hybrid provider and require it;"
            echo "without it they fail, and yfinance alone is survivorship-biased."
            exit 1
          fi
          echo "TIINGO_API_KEY is set (${#TIINGO_API_KEY} characters)."

      - name: Tiingo — key works
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          KEY = os.environ["TIINGO_API_KEY"]
          H = {"Authorization": f"Token {KEY}", "Content-Type": "application/json"}


          def call(url: str, what: str):
              """Report the verdict, never the credential."""
              try:
                  with urllib.request.urlopen(
                      urllib.request.Request(url, headers=H), timeout=30
                  ) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  print(f"::error::{what} returned HTTP {e.code}.")
                  if e.code in (401, 403):
                      print("The key is set but rejected: wrong value, revoked, "
                            "or not entitled to this endpoint. Rotate it and "
                            "update the repository secret.")
                  elif e.code == 429:
                      print("Rate limited. The key is valid but its quota is "
                            "exhausted; a full retrain would stall.")
                  sys.exit(1)
              except Exception as e:                    # noqa: BLE001
                  print(f"::error::{what} failed: {type(e).__name__}")
                  sys.exit(1)


          status, body = call("https://api.tiingo.com/api/test/", "auth check")
          message = str(body.get("message", ""))
          print(f"auth check: HTTP {status} — {message or 'no message'}")
          # Tiingo answers /api/test/ with HTTP 200 even when the token is
          # wrong, putting the rejection in the body: a bad key returns
          # 200 "Auth Token was not correct". Checking the status alone would
          # report a pass here and leave the real failure to the price call.
          if "success" not in message.lower():
              print("::error::the key was rejected. Tiingo returns HTTP 200 for "
                    "a bad token and reports it in the body, which is why this "
                    "reads the message rather than the status.")
              sys.exit(1)

          # One small, cheap window on a liquid name: enough to prove the key is
          # entitled to price data, not just to the auth endpoint.
          status, rows = call(
              "https://api.tiingo.com/tiingo/daily/AAPL/prices"
              "?startDate=2024-01-02&endDate=2024-01-05",
              "price check",
          )
          if not rows:
              print("::error::price check returned no rows. The key authenticates "
                    "but is not serving price data.")
              sys.exit(1)
          print(f"price check: HTTP {status} — {len(rows)} rows for AAPL")
          print("Tiingo is usable. A scheduled retrain will not fail on this key.")
          PY

      - name: FRED — optional, reported either way
        run: |
          if [ -z "${FRED_API_KEY}" ]; then
            echo "::warning::FRED_API_KEY is not set."
            echo "This is not fatal: training falls back to Yahoo for VIX/TNX/IRX."
            echo "It does mean the macro cross-fill is unavailable, so missing"
            echo "macro dates are not repaired from a second source."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          url = ("https://api.stlouisfed.org/fred/series/observations"
                 f"?series_id=VIXCLS&api_key={os.environ['FRED_API_KEY']}"
                 "&file_type=json&limit=1")
          try:
              with urllib.request.urlopen(url, timeout=30) as r:
                  n = len(json.loads(r.read().decode()).get("observations", []))
              print(f"FRED: HTTP 200 — {n} observation(s) for VIXCLS. Usable.")
          except urllib.error.HTTPError as e:
              print(f"::warning::FRED returned HTTP {e.code}; the key is set but "
                    "not working. Macro cross-fill will be unavailable.")
              sys.exit(0)
          except Exception as e:                        # noqa: BLE001
              print(f"::warning::FRED check failed: {type(e).__name__}. "
                    "Not fatal for training.")
              sys.exit(0)
          PY

      - name: Summary
        run: |
          echo "### Secret check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- TIINGO_API_KEY: authenticates and serves prices" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${FRED_API_KEY}" ]; then
            echo "- FRED_API_KEY: not set (optional; no macro cross-fill)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- FRED_API_KEY: set" >> "$GITHUB_STEP_SUMMARY"
          fi
