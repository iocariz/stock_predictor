# Backtest a grid of strategy variants against the wf_scored.parquet produced
# by a previous train-sp500 run (fast: no retraining, one benchmark download).

name: backtest-sweep

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: train-sp500 run ID whose model-and-scores artifact to reuse
        required: true
        type: string

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Download walk-forward scores
        uses: actions/download-artifact@v4
        with:
          name: model-and-scores-${{ inputs.run_id }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/

      - name: Run sweep
        run: uv run python scripts/backtest_sweep.py artifacts/wf_scored.parquet
