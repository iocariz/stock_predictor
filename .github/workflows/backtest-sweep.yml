# Backtest a grid of strategy variants against the wf_scored.parquet produced
# by a previous train-sp500 run (fast: no retraining, one benchmark download).

name: backtest-sweep

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: train-sp500 run ID whose model-bundle artifact to reuse
        required: true
        type: string

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Download walk-forward scores
        uses: actions/download-artifact@v4
        with:
          name: model-bundle-${{ inputs.run_id }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts/

      # The panel is downloaded with the scores and passed explicitly. The
      # sweep used to run on scores alone, so every variant in the grid priced
      # its fills from the point-in-time scored panel -- worth several points of
      # return, and applied uniformly, so the grid looked internally consistent
      # while every cell in it was measured the wrong way.
      - name: Run sweep
        run: |
          uv run python scripts/backtest_sweep.py artifacts/wf_scored.parquet \
            --execution-prices artifacts/execution_prices.parquet
