# Full train-sp500 on demand (long-running). Configure repository Secrets first.
#
# Secrets:
#   TIINGO_API_KEY — REQUIRED. Scheduled retrains train on the hybrid provider,
#                    which recovers the delisted names Yahoo stops serving.
#                    Training on yfinance alone gives a survivorship-biased
#                    panel: 79 of 347 companies that left the index during the
#                    window are missing or wrong without it.
#   FRED_API_KEY   — optional; Yahoo↔FRED macro cross-fill
#
# Artifacts (retention default 90 days): model.pkl, wf_scored.parquet, plots/

name: train-sp500

on:
  # Monthly retrain so the deployed model doesn't go stale: 05:00 UTC on the
  # 1st (before US market open). Scheduled runs use the *hybrid* provider,
  # full universe, and the lambdarank objective (see EXTRA_TRAIN_ARGS below).
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:
    inputs:
      provider:
        description: Equity/macro data provider
        type: choice
        default: yfinance
        options:
          - yfinance
          - tiingo
      sample_n:
        description: Max tickers (use 10000 for ~full universe)
        type: string
        default: "10000"
      sweep_run_id:
        description: >-
          Sweep-only mode: reuse this train-sp500 run's wf_scored.parquet and
          run scripts/backtest_sweep.py instead of retraining (leave empty to train)
        type: string
        default: ""
      extra_train_args:
        description: Extra flags appended to train-sp500 (e.g. --rank-objective)
        type: string
        default: ""
      sweep_args:
        description: Extra flags for backtest_sweep.py in sweep-only mode (e.g. --until-date 2022-12-31)
        type: string
        default: ""

concurrency:
  group: train-sp500-${{ github.repository }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 720

    env:
      # Explicit, not inherited. A schedule event has no inputs, so this
      # resolved to an empty string and fell through to the pipeline's hybrid
      # default -- correct by accident, and it read as yfinance everywhere it
      # was documented. The 2026-09-01 run died on the missing Tiingo key
      # after 22 seconds.
      TRAIN_PROVIDER: ${{ github.event.inputs.provider || 'hybrid' }}
      PREDICT_PROVIDER: ${{ github.event.inputs.provider }}
      SAMPLE_N: ${{ github.event.inputs.sample_n }}
      MODEL: artifacts/model.pkl
      WF_SCORES: artifacts/wf_scored.parquet
      PLOTS_DIR: artifacts/plots
      # Manual dispatch: whatever the user typed. Scheduled retrain: default
      # to the promoted lambdarank objective.
      EXTRA_TRAIN_ARGS: ${{ inputs.extra_train_args || (github.event_name == 'schedule' && '--rank-objective') || '' }}
      # A scheduled retrain refits through the newest labellable date.
      # It used to inherit a fixed TRAIN_END and so learned nothing new.
      REFIT: ${{ github.event_name == 'schedule' && '1' || '0' }}
      # Macro merge + optional Tiingo
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Sync dependencies
        run: uv sync --extra dev --extra tiingo

      - name: Create artifact directories
        run: mkdir -p artifacts/plots

      - name: Download walk-forward scores (sweep-only mode)
        if: inputs.sweep_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: model-bundle-${{ inputs.sweep_run_id }}
          run-id: ${{ inputs.sweep_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/

      - name: Run backtest sweep (sweep-only mode)
        if: inputs.sweep_run_id != ''
        run: |
          uv run python scripts/backtest_sweep.py artifacts/wf_scored.parquet \
            --execution-prices artifacts/execution_prices.parquet ${{ inputs.sweep_args }}

      - name: Check required secrets
        if: inputs.sweep_run_id == '' && env.TRAIN_PROVIDER != 'yfinance'
        run: |
          if [ -z "${TIINGO_API_KEY}" ]; then
            echo "::error::TIINGO_API_KEY is not set, and TRAIN_PROVIDER=${TRAIN_PROVIDER}"
            echo "Training on yfinance alone produces a survivorship-biased panel."
            echo "Add the secret, or dispatch manually with provider=yfinance and"
            echo "treat the result as biased."
            exit 1
          fi

      - name: Run full training
        if: inputs.sweep_run_id == ''
        run: bash scripts/run_pipeline.sh train-full

      - name: Upload model and walk-forward scores
        if: inputs.sweep_run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: model-bundle-${{ github.run_id }}
          path: |
            artifacts/model_candidate.pkl
            artifacts/model_candidate.meta.json
            artifacts/wf_scored.parquet
            artifacts/execution_prices.parquet
          if-no-files-found: error

      - name: Upload plots
        uses: actions/upload-artifact@v4
        with:
          name: plots-${{ github.run_id }}
          path: artifacts/plots/
          if-no-files-found: warn

      - name: Upload run snapshots (optional)
        uses: actions/upload-artifact@v4
        with:
          name: run-snapshots-${{ github.run_id }}
          path: artifacts/runs/
          if-no-files-found: ignore
